name: Windows build gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain versions
        shell: pwsh
        run: |
          python --version
          node --version
          npm.cmd --version
          $PSVersionTable.PSVersion

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parse errors in $($_.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { throw 'PowerShell parse gate failed.' }

      - name: Build and import API
        shell: pwsh
        run: |
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install --disable-pip-version-check -e .\apps\api
          .\.ci-venv\Scripts\python.exe -m compileall -q .\apps\api\src
          .\.ci-venv\Scripts\python.exe -c "from waxloom_api.main import app; assert app.title == 'Waxloom API'; print('Waxloom API import PASS')"
          .\.ci-venv\Scripts\python.exe .\scripts\CHECK_DISCOVERY_ENGINE.py

      - name: Install web dependencies
        shell: pwsh
        working-directory: apps/web
        run: npm.cmd install --package-lock=false

      - name: Build web
        shell: pwsh
        working-directory: apps/web
        run: npm.cmd run build

      - name: Smoke direct Vite launcher
        shell: pwsh
        working-directory: apps/web
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node.exe).Source
          $process = Start-Process `
            -FilePath $node `
            -ArgumentList @('.\node_modules\vite\bin\vite.js', '--host', '127.0.0.1', '--port', '5173') `
            -WorkingDirectory (Get-Location).Path `
            -NoNewWindow `
            -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(30)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Vite exited before readiness (exit code $($process.ExitCode))."
              }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:5173' -TimeoutSec 2 -ErrorAction Stop
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw 'Timed out waiting for Vite.' }
            Write-Host 'Vite direct-launch smoke PASS'
          }
          finally {
            if ($process -and -not $process.HasExited) {
              taskkill.exe /PID $process.Id /T /F *> $null
            }
          }
