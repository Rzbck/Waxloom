name: Public repository security gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run fail-closed repository security gate
        shell: pwsh
        run: ./scripts/security-gate.ps1
