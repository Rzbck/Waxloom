name: WaxloomWatch
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WaxloomWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
      - path: ../Shared
    preBuildScripts:
      - name: Prepare Waxloom app icon
        script: |
          bash "$SRCROOT/../../../scripts/ios/prepare-waxloom-icon.sh"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Waxloom
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rzbck.waxloom
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rzbck.waxloom.watchkitapp
        PRODUCT_NAME: WaxloomWatch
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
