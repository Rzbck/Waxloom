# Enable transfer compression for build assets without changing media streaming.
# nginx includes conf.d/*.conf within the `http` context. The production
# default.conf is bind-mounted separately and must remain untouched.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript;